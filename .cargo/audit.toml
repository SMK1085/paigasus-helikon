# .cargo/audit.toml — cargo-audit policy for the Helikon workspace.
# Reference: https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Kept in sync with the [advisories].ignore list in /deny.toml — both tools
# run as required CI gates (see .github/workflows/audit.yml and the deny job
# in ci.yml) and must agree on what is policy-allowed.

[advisories]
ignore = [
    # Historical note: the stale rsa (RUSTSEC-2023-0071) and async-std
    # (RUSTSEC-2025-0052) entries covered crates that left the lockfile in an
    # earlier dependency update; noticed and removed during the SMA-327
    # deny/audit reconciliation.
    #
    # backoff is unmaintained; transitive via temporalio-client/temporalio-sdk-core
    # 0.5 (Temporal Rust SDK, Public Preview). No fixed upgrade exists ("No safe
    # upgrade is available"). Revisit on every temporalio-* bump (SMA-332).
    "RUSTSEC-2025-0012",
    # instant is unmaintained; transitive via backoff (above) from the same
    # temporalio-* 0.5 stack. No fixed upgrade exists. Revisit on every
    # temporalio-* bump (SMA-332).
    "RUSTSEC-2024-0384",
    # paste is unmaintained (archived by dtolnay; no vulnerability), pulled by
    # parquet — the latest stable parquet (59.0.0, via paigasus-helikon-evals'
    # trace-parquet feature) still depends on it and no paste-free release
    # exists yet. Compile-time proc-macro only; revisit when arrow-rs drops it
    # upstream. Accepted at SMA-333. Mirrored in /deny.toml.
    "RUSTSEC-2024-0436",
]
