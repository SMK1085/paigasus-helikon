# .cargo/audit.toml — cargo-audit policy for the Helikon workspace.
# Reference: https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Kept in sync with the [advisories].ignore list in /deny.toml — both tools
# run as required CI gates (see .github/workflows/audit.yml and
# .github/workflows/deny.yml) and must agree on what is policy-allowed.

[advisories]
ignore = [
    # Historical note: the stale rsa (RUSTSEC-2023-0071) and async-std
    # (RUSTSEC-2025-0052) entries covered crates that left the lockfile in an
    # earlier dependency update; noticed and removed during the SMA-327
    # deny/audit reconciliation.
    #
    # Historical note: the backoff (RUSTSEC-2025-0012) and instant
    # (RUSTSEC-2024-0384) entries were removed in SMA-823. Neither crate is in
    # Cargo.lock after the temporalio-* 1.0 upgrade.
    #
    # Historical note: the paste (RUSTSEC-2024-0436) entry was removed in
    # SMA-823. parquet 60 does not depend on paste, and paste is not in
    # Cargo.lock.
    #
    # smartstring is unmaintained (no vulnerability), transitive via rhai
    # (paigasus-helikon-cli's scripting engine). rhai 1.27.0 (the version in
    # Cargo.lock) still depends on it non-optionally, so no upgrade path
    # exists. Revisit on every rhai bump, or if the CLI drops rhai. Noticed on SMA-461 when the
    # advisory landed mid-PR and reddened main too. Mirrored in /deny.toml.
    "RUSTSEC-2026-0249",
    # Historical note: the libsqlite3-sys (RUSTSEC-2026-0459) entry was removed
    # in SMA-763 after sqlx 0.9.1 allowed libsqlite3-sys >= 0.39.
    #
    # chrono is unmaintained (no vulnerability; all versions affected, no fixed
    # version). The workspace does not depend on chrono directly. It comes in via
    # rmcp (which also enables schemars/chrono04), arrow/parquet, gcp_auth,
    # prost-wkt and temporalio-common-wasm, all non-optionally. Upstream tracking:
    # modelcontextprotocol/rust-sdk#1469, apache/arrow-rs#9183. Remove when
    # `cargo tree --all-features -i chrono` is empty; revisit on every bump of
    # those crates (SMA-779). Mirrored in /deny.toml.
    "RUSTSEC-2026-0543",
]
