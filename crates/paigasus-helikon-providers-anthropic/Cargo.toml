[package]
name        = "paigasus-helikon-providers-anthropic"
description = "Anthropic provider for the Paigasus Helikon AI SDK."
version                = "0.3.6"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

[features]
default            = ["rustls-aws-lc"]
rustls-aws-lc      = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider", "dep:rustls"]

[dependencies]
paigasus-helikon-core = { workspace = true }
async-trait           = { workspace = true }
async-stream          = { workspace = true }
eventsource-stream    = { workspace = true }
futures-core          = { workspace = true }
futures-util          = { workspace = true }
reqwest               = { workspace = true, features = ["json", "stream"] }
rustls                = { workspace = true, optional = true, features = ["std"] }
serde                 = { workspace = true }
serde_json            = { workspace = true }
thiserror             = { workspace = true }
anyhow                = { workspace = true }
tokio                 = { workspace = true }
tokio-util            = { workspace = true }
tracing               = { workspace = true }

[dev-dependencies]
paigasus-helikon-runtime-tokio = { workspace = true }
wiremock = { workspace = true }
insta    = { workspace = true, features = ["json", "yaml"] }
tokio    = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest  = { workspace = true }
rustls   = { workspace = true, features = ["std", "aws-lc-rs"] }

[lints]
workspace = true
