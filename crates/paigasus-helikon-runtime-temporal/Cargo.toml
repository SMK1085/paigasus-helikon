[package]
name        = "paigasus-helikon-runtime-temporal"
description = "Temporal-backed durable runtime for the Paigasus Helikon AI SDK."
version                = "0.4.4"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
paigasus-helikon-core = { workspace = true }
temporalio-sdk         = { workspace = true }
temporalio-client      = { workspace = true }
temporalio-sdk-core    = { workspace = true }
temporalio-common      = { workspace = true }
temporalio-macros      = { workspace = true }
temporalio-workflow    = { workspace = true }
async-trait            = { workspace = true }
tokio                  = { workspace = true }
futures                = { workspace = true }
futures-core           = { workspace = true }
futures-util           = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
thiserror              = { workspace = true }
tracing                = { workspace = true }
uuid                   = { workspace = true }
anyhow                 = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["macros"] }
futures-util = { workspace = true }
schemars     = { workspace = true }
url          = { workspace = true }

[lints]
workspace = true
