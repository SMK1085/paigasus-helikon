name: msrv

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: msrv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain master (the v1 tag is stale — see CLAUDE.md).
      # A SHA ref carries no toolchain name, so `toolchain:` is required here;
      # it is what the bare `@stable` ref used to supply (SMA-486).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # taiki-e/install-action v2.85.11
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-msrv
      # cargo-msrv has no --workspace flag; verify one representative crate
      # whose rust-version inherits from [workspace.package]. Since every
      # member uses `rust-version.workspace = true`, a green check on one
      # inheriting crate is a green check on all of them.
      - run: cargo msrv --path crates/paigasus-helikon-core verify
