name: msrv

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: msrv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# SMA-618: this block is not cosmetic. rust-cache hashes every CARGO*/RUST*
# variable into its cache key, so a workflow that omits one computes a
# different key and silently stops sharing a cache entry with the jobs it is
# meant to share with. Keep byte-identical with the other cache-bearing
# workflows; scripts/check-cargo-profile-env-sync.sh enforces it.
env:
  CARGO_TERM_COLOR: always
  # SMA-618: CI keeps line tables (file/line in panic backtraces) and drops
  # variable and type debug info, which measured 79% of the compressed bytes in
  # a cached target dir. This variable is INSIDE rust-cache's key, so it must be
  # byte-identical across every cache-bearing workflow —
  # scripts/check-cargo-profile-env-sync.sh fails the `fmt` gate if it drifts.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      # A SHA ref carries no toolchain name, so `toolchain:` is required here;
      # it is what the bare `@stable` ref used to supply (SMA-486).
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      # Swatinem/rust-cache v2.9.2
      # SMA-618: save only from the default branch — see the note on `clippy`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # taiki-e/install-action v2.87.21
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-msrv
      # cargo-msrv has no --workspace flag; verify one representative crate
      # whose rust-version inherits from [workspace.package]. Since every
      # member uses `rust-version.workspace = true`, a green check on one
      # inheriting crate is a green check on all of them.
      - run: cargo msrv --path crates/paigasus-helikon-core verify
