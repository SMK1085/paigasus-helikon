name: release-plz

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel mid-tag-push / mid-PR-update

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    # NB: this workflow runs only on push to main. A PR never runs it, so a
    # change here is not tested by the PR that makes it.
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0          # release-plz needs full history
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      # actions/create-github-app-token v3.3.0
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # release-plz/action v0.5.147
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz/action v0.5.147
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
