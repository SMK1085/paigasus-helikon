name: sbom

on:
  push:
    tags:
      - "paigasus-helikon-v*"

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # tags are immutable; never cancel an in-flight run

permissions:
  contents: write   # create release / upload asset

env:
  CARGO_TERM_COLOR: always

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      # A SHA ref carries no toolchain name, so `toolchain:` is required here;
      # it is what the bare `@stable` ref used to supply (SMA-486).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Swatinem/rust-cache v2.9.2
      # SMA-618: save only from the default branch — see the note on `clippy`.
      # sbom.yml is tag-triggered only, so this expression never holds
      # and the step becomes restore-only. That is intended: main never runs
      # `sbom`, so there is no sbom-keyed entry to restore either, and the step
      # is inert until PR 2 makes it a registry reader. Do not "fix" it to save
      # on tags — that would spend budget on the release path this ticket frees.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # taiki-e/install-action v2.85.11
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Facade crate with --all-features captures the full workspace
          # surface (paigasus-helikon-core unconditionally + 10 siblings).
          # cargo-cyclonedx 0.5.x has no -p flag; target the crate via
          # --manifest-path. Default --spec-version is 1.3, so pin 1.5
          # explicitly.
          cargo cyclonedx \
            --manifest-path crates/paigasus-helikon/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --all-features
          # cargo-cyclonedx 0.5.x writes <crate-name>.cdx.json under the
          # package dir. Defensive find in case the filename pattern shifts.
          SBOM="$(find crates/paigasus-helikon -maxdepth 1 -name '*.cdx.json' | head -n1)"
          test -n "$SBOM"
          cp "$SBOM" "paigasus-helikon-${REF_NAME}-cyclonedx.json"

      - name: Verify SBOM is parseable CycloneDX 1.5 JSON
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5"' \
            "paigasus-helikon-${REF_NAME}-cyclonedx.json"

      # softprops/action-gh-release v3.0.2
      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: "paigasus-helikon-${{ github.ref_name }}-cyclonedx.json"
          fail_on_unmatched_files: true
