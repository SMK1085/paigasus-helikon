name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required by dorny/paths-filter in sessions-it — do not remove. On a
  # pull_request it resolves changed files through `pulls.listFiles` (job log:
  # "Fetching list of changed files for PR#N from GitHub API"). It looks
  # removable because it is: the repo is public, so that call succeeds without
  # the scope and has since SMA-330. That is an accident of repository
  # visibility, not a property of the workflow — and sessions-it is a
  # *required* check, so the cost of being wrong is every PR blocked.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TOOLCHAIN: nightly-2026-05-01

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.94"]
        include:
          - toolchain: stable
            test_args: --workspace --all-features
          - toolchain: "1.94"
            test_args: --workspace --all-features -- --skip trybuild_ui
    runs-on: ${{ matrix.os }}
    env:
      # Turn a silently-unenforcing sandbox into a hard failure (never green-by-skip).
      HELIKON_REQUIRE_SANDBOX: 1
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      # Cross-platform: this is the only site exercising the macOS and Windows
      # branches of the action, so it carries all three pinned digests.
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo test ${{ matrix.test_args }}

  build-no-default-features:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build -p paigasus-helikon-runtime-axum --no-default-features
      - run: cargo build -p paigasus-helikon-runtime-actix --no-default-features
      # SMA-461: every agentcore protocol mode (mcp/a2a/ag-ui/ws) is default-on and
      # `#[cfg]`-gated down to individual AppState fields and builder methods, so a
      # missed gate only ever shows up with default features off. Tests run too — the
      # gating reaches test modules as well, and a build alone would not catch that.
      - run: cargo build -p paigasus-helikon-runtime-agentcore --no-default-features
      - run: cargo test -p paigasus-helikon-runtime-agentcore --no-default-features
      - name: Assert no axum leakage under runtime-actix
        run: |
          if cargo tree -p paigasus-helikon --features runtime-actix -e no-dev | grep -qE '(^|[^-])axum v'; then
            echo "::error::axum leaked into the runtime-actix feature dependency graph"
            cargo tree -p paigasus-helikon --features runtime-actix -e no-dev | grep -E '(^|[^-])axum v' || true
            exit 1
          fi
          echo "no axum under runtime-actix"

  docs:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  doc-coverage:
    runs-on: ubuntu-latest
    env:
      DOC_COVERAGE_THRESHOLD: "80"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: bash scripts/check-doc-coverage.sh
        env:
          NIGHTLY_CHANNEL: ${{ env.NIGHTLY_TOOLCHAIN }}

  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # taiki-e/install-action v2.85.11
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: convco@0.6.3
      - run: convco check ${{ github.event.pull_request.base.sha }}..HEAD

  sessions-it:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # dorny/paths-filter v4.0.2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            sessions:
              - 'Cargo.toml'
              - 'crates/paigasus-helikon-sessions-**'
              - 'crates/paigasus-helikon-core/src/session.rs'
              - '.github/workflows/ci.yml'
              # The protoc install lives here since SMA-458. Without this entry a
              # protoc bump would skip this REQUIRED job, reporting green having
              # run nothing.
              - '.github/actions/**'
              - 'Cargo.lock'
      - if: steps.filter.outputs.sessions == 'false'
        run: echo "No session-related changes; nothing to run."
      # dtolnay/rust-toolchain: SHA-pinned to master; the `toolchain:` input
      # below is mandatory, not stylistic -- see CLAUDE.md.
      - if: steps.filter.outputs.sessions == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      # Pinned, checksum-verified protoc — temporalio-protos compiles .proto at
      # build time (prost-build); a system protoc is required (SMA-332). The
      # version and its digests live in the action (SMA-458).
      - if: steps.filter.outputs.sessions == 'true'
        uses: ./.github/actions/setup-protoc
      # Swatinem/rust-cache v2.9.2
      - if: steps.filter.outputs.sessions == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - if: steps.filter.outputs.sessions == 'true'
        name: Start Postgres + Redis
        run: |
          # Digest-pinned for reproducibility (postgres:17 / redis:7 at resolve time).
          docker run -d --name pg  -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
          docker run -d --name rds -p 6379:6379 redis:7@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
          # Probe inside the containers (their own clients) — redis-tools/postgres-client
          # are not reliably preinstalled on the runner host.
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker exec pg pg_isready -U postgres || { echo "Postgres failed to start"; docker logs pg; exit 1; }
          for i in $(seq 1 30); do docker exec rds redis-cli ping && break; sleep 2; done
          docker exec rds redis-cli ping || { echo "Redis failed to start"; docker logs rds; exit 1; }
      - if: steps.filter.outputs.sessions == 'true'
        name: Run session integration suite (retry)
        env:
          HELIKON_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          HELIKON_TEST_REDIS_URL: redis://localhost:6379
        run: |
          for attempt in 1 2 3; do
            cargo test -p paigasus-helikon-sessions-postgres -p paigasus-helikon-sessions-redis && exit 0
            echo "attempt $attempt failed; retrying in 5s"; sleep 5
          done
          exit 1

  markdown-lint:
    runs-on: ubuntu-latest
    # Bounds a hung `npm ci`. A required check that sits for six hours is worse
    # than one that fails.
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned markdownlint-cli2
        run: npm ci
      # No glob arguments: .markdownlint-cli2.jsonc's "globs" is the sole source
      # of truth, so this run and a bare local run lint an identical set by
      # construction. Deliberately NOT path-filtered -- a path-filtered REQUIRED
      # check never reports on a PR that touches no Markdown, and blocks it
      # forever (the trap sessions-it avoids with step-level guards).
      - name: Lint Markdown
        run: npx markdownlint-cli2
      # Asserts the config above is actually in force. An invalid rule-option
      # value disables a rule silently, and the gated file set can collapse with
      # no signal -- either would make the step above a green no-op.
      - name: Verify the lint config is in force
        run: bash scripts/check-markdownlint-config.sh
