version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    assignees: ["SMK1085"]
    ignore:
      # jiff 0.2.29 activates a `defmt` integration that pulls the unmaintained
      # `proc-macro-error2` (RUSTSEC-2026-0173), failing `cargo audit`. Matches
      # the `=0.2.28` pin in the root Cargo.toml. Drop this once a later jiff
      # release sheds that transitive dep (a newer version will be re-proposed).
      - dependency-name: "jiff"
        versions: ["0.2.29"]
    groups:
      # The temporalio-* crates are version-locked to each other: temporalio-sdk
      # declares an EXACT pin on temporalio-sdk-core (1.0.0 requires =0.9.0) and
      # tilde pins on client/common/macros/workflow, and the macro-generated code
      # references the runtime crates by absolute path. A lone bump therefore puts
      # two versions of a family crate in Cargo.lock and compiles macro output
      # against the wrong runtime. Grouping keeps them in one PR.
      # This has now failed twice: SMA-549 (0.5 -> 0.7) and SMA-622 (0.7 -> 1.0),
      # the latter from Dependabot PR #247 proposing temporalio-macros alone.
      # MUST stay ABOVE rust-major/rust-minor-patch: those use patterns ["*"] and
      # Dependabot assigns a dependency to the FIRST matching group.
      temporalio:
        patterns:
          - "temporalio*"
      tokio-stack:
        patterns:
          - "tokio*"
          - "tower*"
          - "hyper*"
          - "reqwest*"
      tracing-otel:
        patterns:
          - "tracing*"
          - "opentelemetry*"
      serde-stack:
        patterns:
          - "serde*"
          - "schemars"
          - "serde_with*"
      rust-major:
        patterns: ["*"]
        update-types: ["major"]
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    assignees: ["SMK1085"]
    groups:
      gh-actions:
        patterns: ["*"]
