[workspace]
resolver = "2"
members  = ["crates/*"]

[workspace.package]
version       = "0.0.0"
edition       = "2021"
rust-version  = "1.94"
authors       = ["Sven Maschek"]
license       = "Apache-2.0 OR MIT"
repository    = "https://github.com/SMK1085/paigasus-helikon"
homepage      = "https://github.com/SMK1085/paigasus-helikon"
keywords      = ["ai", "llm", "agents", "sdk", "openai"]
categories    = ["api-bindings", "asynchronous"]

[workspace.dependencies]
anyhow                = "1"
arrow                 = { version = "59", default-features = false }
async-openai          = "0.41"
cap-std               = "4"
axum                  = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64                = "0.22"
async-stream          = "0.3"
async-trait           = "0.1"
clap                  = { version = "4", features = ["derive"] }
eventsource-stream    = "0.2"
fastrand              = "2"
futures-core          = "0.3"
futures-util          = { version = "0.3", default-features = false, features = ["std"] }
# temporalio-macros' `#[activities]`-generated code references `::futures::FutureExt`/
# `::futures::future::BoxFuture` by absolute path (verified by reading
# temporalio-macros-0.5.0/src/activities_definitions.rs) — the umbrella `futures` crate
# must be a direct dependency of any crate using that macro, distinct from the
# `futures-core`/`futures-util` sub-crates pinned above.
futures               = { version = "0.3", default-features = false, features = ["std"] }
# default-features off + aws-lc-rs: gcp_auth's default `ring` feature enables
# rustls/ring, but the rest of the workspace (AWS smithy, reqwest) uses
# rustls/aws-lc-rs. Two rustls CryptoProvider features in one graph makes
# CryptoProvider::install_default() ambiguous and panics any rustls auto-default
# user (e.g. tools' forkd_tls test) under `cargo test --workspace --all-features`.
gcp_auth              = { version = "0.12", default-features = false, features = ["aws-lc-rs"] }
insta                 = "1"
globset               = "0.4"
# Pinned to 0.2.28: jiff 0.2.29 activates a `defmt` integration that pulls the
# unmaintained `proc-macro-error2` (RUSTSEC-2026-0173), failing `cargo audit`.
# Relax once jiff drops that transitive dep.
jiff                  = { version = "=0.2.28", features = ["serde"] }
jsonschema            = { version = "0.47", default-features = false }
landlock              = "0.4"
libc                  = "0.2"
notify                = "8"
notify-debouncer-mini = "0.7"
opentelemetry         = "0.32"
parquet               = { version = "59", default-features = false, features = ["arrow", "snap"] }
proc-macro-crate      = "3"
proc-macro2           = "1"
quote                 = "1"
reqwest               = { version = "0.13", default-features = false }
rhai                  = { version = "1", features = ["sync", "serde"] }
rmcp                  = { version = "2.1", default-features = false, features = [
  "client",
  "server",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
rustversion           = "1"
schemars              = "1"
seccompiler           = "0.5"
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
sqlx                  = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
syn                   = { version = "2", features = ["full"] }
tempfile              = "3"
thiserror             = "2"
tokio                 = { version = "1", features = ["full"] }
tokio-tungstenite     = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio-util            = { version = "0.7", default-features = false, features = ["rt"] }
toml                  = "1"
tower                 = { version = "0.5", default-features = false, features = ["util"] }
tracing               = "0.1"
tracing-subscriber    = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry_sdk     = { version = "0.32", features = ["rt-tokio", "testing"] }
opentelemetry-otlp    = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
trybuild              = "1"
url                   = "2"
utoipa                = { version = "5.5.0", default-features = false, features = ["macros", "axum_extras"] }
uuid                  = { version = "1.23.4", default-features = false, features = ["v4"] }
dom_smoothie          = "0.18"
htmd                  = "0.5"
wiremock              = "0.6"
rcgen                 = "0.14"
tokio-rustls          = "0.26"

# Temporal Rust SDK (Public Preview; crates.io since 2026-02-19). TLS risk (requires
# verification on every temporalio-* bump): temporalio-common → opentelemetry-otlp
# unconditionally pulls a second reqwest (0.12 via hyper-rustls) into the graph. This is
# safe ONLY because all consumers unify on the single shared rustls 0.23 instance, which
# resolves to aws-lc-rs for every consumer — verify `cargo tree -i ring` stays empty.
# The `ephemeral-server` feature (temporalio-sdk-core) additionally pulls its own
# reqwest+TLS stack and must stay unenabled; runtime-temporal's integration tests use
# the external-server env gate instead.
temporalio-sdk      = { version = "0.5", default-features = false }
temporalio-client   = { version = "0.5", default-features = false, features = ["tls-aws-lc"] }
temporalio-sdk-core = { version = "0.5", default-features = false, features = ["tls-aws-lc"] }
temporalio-common   = { version = "0.5", default-features = false }
# temporalio-sdk does NOT re-export the `#[activities]`/`#[activity]` attribute
# macros (verified by reading temporalio-sdk-0.5.0/src/lib.rs: its own doctest
# imports them from `temporalio_macros` directly) — a direct dependency is
# required to invoke them, even though temporalio-macros was already pulled in
# transitively as a proc-macro dep of temporalio-sdk/temporalio-workflow.
temporalio-macros   = { version = "0.5", default-features = false }
# temporalio-workflow: the `#[workflow]`/`#[workflow_methods]` macro-generated
# code references `::temporalio_workflow::…` (verified in
# temporalio-macros-0.5.0/src/workflow_definitions.rs), and it exports the
# workflow-authoring types (`WorkflowContext`, `ActivityOptions`, `join_all`,
# `select!`, …) that `temporalio-sdk` re-exports. A direct dependency is
# required to invoke the workflow macros, mirroring the temporalio-macros note
# above.
temporalio-workflow = { version = "0.5", default-features = false }

# AWS SDK — rustls + aws-lc-rs TLS connector.
# aws-config "default-https-client" → aws-smithy-runtime/default-https-client
# → aws-smithy-http-client/rustls-aws-lc (rustls 0.23 + aws-lc-rs).
# This shares the aws-lc-rs CryptoProvider already registered by
# reqwest/async-openai in the workspace — no second provider is introduced.
# The "ring"-based paths (legacy-rustls-ring, tls-rustls) are intentionally
# omitted: they either pull RUSTSEC-2026-0098 or cause a multi-provider panic.
aws-config             = { version = "1.8.18", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-bedrockruntime = { version = "1.135.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-types       = { version = "1.5.0", default-features = false }
aws-smithy-runtime-api = { version = "1.12.3", default-features = false }
aws-smithy-runtime     = { version = "1.11.3", default-features = false, features = ["client"] }
aws-smithy-http-client = { version = "1.1.13", default-features = false, features = ["rustls-aws-lc"] }

# Internal — single source of truth so members depend via `workspace = true`
paigasus-helikon                     = { path = "crates/paigasus-helikon", version = "0.4.21" }
paigasus-helikon-core                = { path = "crates/paigasus-helikon-core", version = "0.5.14" }
paigasus-helikon-macros              = { path = "crates/paigasus-helikon-macros", version = "0.2.3" }
paigasus-helikon-providers-openai    = { path = "crates/paigasus-helikon-providers-openai", version = "0.2.17" }
paigasus-helikon-providers-anthropic = { path = "crates/paigasus-helikon-providers-anthropic", version = "0.1.18" }
paigasus-helikon-mcp                 = { path = "crates/paigasus-helikon-mcp", version = "0.1.15" }
paigasus-helikon-tools               = { path = "crates/paigasus-helikon-tools", version = "0.2.10" }
paigasus-helikon-runtime-tokio       = { path = "crates/paigasus-helikon-runtime-tokio", version = "0.1.17" }
paigasus-helikon-runtime-axum        = { path = "crates/paigasus-helikon-runtime-axum", version = "0.1.2", default-features = false }
paigasus-helikon-runtime-temporal    = { path = "crates/paigasus-helikon-runtime-temporal", version = "0.2.0" }
paigasus-helikon-runtime-agentcore   = { path = "crates/paigasus-helikon-runtime-agentcore", version = "0.1.2" }
paigasus-helikon-evals               = { path = "crates/paigasus-helikon-evals", version = "0.1.1" }
paigasus-helikon-sessions-sqlite     = { path = "crates/paigasus-helikon-sessions-sqlite", version = "0.1.20" }
paigasus-helikon-sessions-postgres   = { path = "crates/paigasus-helikon-sessions-postgres", version = "0.1.1" }
paigasus-helikon-sessions-redis      = { path = "crates/paigasus-helikon-sessions-redis", version = "0.1.1" }
paigasus-helikon-providers-bedrock   = { path = "crates/paigasus-helikon-providers-bedrock", version = "0.1.2" }
paigasus-helikon-providers-gemini    = { path = "crates/paigasus-helikon-providers-gemini", version = "0.1.2" }
redis                                = { version = "1.3.0", default-features = false, features = ["tokio-comp", "connection-manager", "streams", "script"] }

[workspace.lints.rust]
missing_docs = "warn"
